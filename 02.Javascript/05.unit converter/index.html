<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Unit converter</title>
</head>
<body>
    <div id="input-container">
    <h2>Metric/Imperial Unit Conversion</h2>
    <input type="number" id="input-txt"> <br>
    <button id="convert-btn">convert</button>
    </div>
    <div class="length-container">
        <h3>Length (Meter/Feet)</h3>
        <p id="length-converter">Meter to Feet | Feet to Meter</p>
    </div>
        <div class="volume-container">
        <h3>Volume (Liters/Gallons)</h3>
        <p id="volume-converter">Liter to Gallon | Gallon to Liter</p>
    </div>
    <div class="mass-container">
        <h3>Mass (Kilograms/Pounds)</h3>
        <p id="mass-converter">Kilograms to Pound | pounds to Kilograms</p>
    </div>
    <script src="index.js"></script>
</body>
</html>
